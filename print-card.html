<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>테스트 카드 인쇄</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/dictionaries/aruco_4x4_1000.js"></script>
<style>
  body { font-family:-apple-system,sans-serif; padding:40px; background:#f5f5f5; }
  h1 { font-size:20px; margin-bottom:8px; }
  p { font-size:14px; color:#666; margin-bottom:24px; }
  .cards { display:flex; gap:40px; flex-wrap:wrap; }
  .card-wrapper { text-align:center; }
  .card-wrapper h3 { font-size:14px; margin-bottom:8px; color:#333; }

  /* 실제 인쇄 크기: 90mm x 50mm */
  .card {
    width:90mm; height:50mm;
    background:#fff; border:1px solid #ccc;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .card-label {
    position:absolute; bottom:3mm; left:0; right:0;
    text-align:center; font-size:8px; color:#999;
  }

  /* ArUco 마커: 40.2mm */
  .aruco-marker {
    width:44mm; height:44mm;
    image-rendering:pixelated;
  }

  /* QR: 44mm */
  .qr-marker {
    width:44mm; height:44mm;
  }

  .print-btn {
    margin-top:24px; padding:12px 32px; background:#333; color:#fff;
    border:none; border-radius:8px; font-size:15px; cursor:pointer;
  }
  .print-btn:hover { background:#555; }

  .note { margin-top:16px; font-size:13px; color:#e67e22; background:#fff8f0; padding:12px; border-radius:8px; border:1px solid #fed7aa; max-width:600px; }

  @media print {
    body { padding:0; background:#fff; }
    h1, p, .print-btn, .note, .card-wrapper h3 { display:none; }
    .cards { gap:20mm; }
    .card { border:0.5pt solid #ccc; }
  }
</style>
</head>
<body>

<h1>측정 테스트 카드 인쇄</h1>
<p>아래 카드를 인쇄하세요. 반드시 <strong>"실제 크기"</strong>로 인쇄해야 합니다 (배율 100%, 페이지에 맞춤 X).</p>

<div class="note">
  <strong>인쇄 설정 확인:</strong><br>
  - 배율: 100% (실제 크기)<br>
  - "페이지에 맞춤" 체크 해제<br>
  - 인쇄 후 실제 자로 확인: 카드 가로 = 90mm, 세로 = 50mm<br>
  - QR코드 = 44mm, ArUco 마커 = 44mm 여야 합니다
</div>

<div class="cards">
  <div class="card-wrapper">
    <h3>QR 코드 카드 (44mm)</h3>
    <div class="card">
      <div id="qr-container" class="qr-marker" style="display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>
      <div class="card-label">QR 44mm | FishingGo Test</div>
    </div>
  </div>

  <div class="card-wrapper">
    <h3>ArUco 마커 카드 (44mm)</h3>
    <div class="card">
      <canvas id="aruco-canvas" class="aruco-marker" style="image-rendering:pixelated;"></canvas>
      <div class="card-label">ArUco ID:0 44mm | FishingGo Test</div>
    </div>
  </div>
</div>

<button class="print-btn" onclick="window.print()">인쇄하기</button>

<script>
function drawQR() {
  const qr = qrcode(0, 'L');
  qr.addData('FISHINGGO-44MM');
  qr.make();

  const container = document.getElementById('qr-container');
  // SVG로 생성하여 인쇄 품질 보장
  const modules = qr.getModuleCount();
  const size = 44; // mm 단위로 SVG viewBox 설정
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${modules} ${modules}" width="44mm" height="44mm" shape-rendering="crispEdges">`;
  svg += `<rect width="${modules}" height="${modules}" fill="#fff"/>`;
  for (let r = 0; r < modules; r++) {
    for (let c = 0; c < modules; c++) {
      if (qr.isDark(r, c)) {
        svg += `<rect x="${c}" y="${r}" width="1" height="1" fill="#000"/>`;
      }
    }
  }
  svg += '</svg>';
  container.innerHTML = svg;
}

// ArUco ID:0 마커 생성
// js-aruco2로 감지 → 감지된 마커를 다시 그려서 호환성 보장
function drawArUco() {
  const canvas = document.getElementById('aruco-canvas');
  const px = 600;
  canvas.width = px;
  canvas.height = px;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 방법: 작은 테스트 이미지에 알려진 마커를 그리고 js-aruco2로 감지해서 검증
  // 여기서는 js-aruco2의 SVG 생성 기능 사용
  try {
    // js-aruco2는 AR.Marker.generateSVG 같은 생성 함수가 없으므로
    // 딕셔너리에서 직접 비트맵을 읽어서 그림
    const dictName = 'ARUCO_4X4_1000';
    const dict = AR.DICTIONARIES[dictName];
    if (!dict) throw new Error('딕셔너리 없음: ' + dictName + '. 로드된 딕셔너리: ' + Object.keys(AR.DICTIONARIES).join(', '));

    const markerId = 0;
    const bits = dict.markerSize; // 내부 데이터 크기 (4)
    const modules = bits + 2; // 테두리 포함 (6)
    const code = dict.codeList[markerId];
    const moduleSize = px / modules;

    // 디버그 출력
    console.log('ArUco dict:', dictName, 'markerSize:', bits, 'code[0]:', code);

    // 배경: 흰색
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, px, px);

    // 테두리: 검정
    ctx.fillStyle = '#000';
    for (let i = 0; i < modules; i++) {
      ctx.fillRect(i * moduleSize, 0, moduleSize, moduleSize);
      ctx.fillRect(i * moduleSize, (modules-1) * moduleSize, moduleSize, moduleSize);
      ctx.fillRect(0, i * moduleSize, moduleSize, moduleSize);
      ctx.fillRect((modules-1) * moduleSize, i * moduleSize, moduleSize, moduleSize);
    }

    // 데이터 영역: code 배열에서 비트 추출
    // code 형식 확인 후 처리
    if (Array.isArray(code)) {
      for (let r = 0; r < bits; r++) {
        for (let c = 0; c < bits; c++) {
          let isBlack = false;
          if (typeof code[r] === 'number') {
            // 바이트 배열: 각 요소가 한 행의 비트
            isBlack = (code[r] >> (bits - 1 - c)) & 1;
          } else if (typeof code[r * bits + c] !== 'undefined') {
            // 플랫 배열
            isBlack = code[r * bits + c];
          }
          if (isBlack) {
            ctx.fillStyle = '#000';
            ctx.fillRect((c + 1) * moduleSize, (r + 1) * moduleSize, moduleSize, moduleSize);
          }
        }
      }
    }

    // 검증: 방금 그린 마커를 js-aruco2로 감지 테스트
    const testImageData = ctx.getImageData(0, 0, px, px);
    const detector = new AR.Detector({ dictionaryName: dictName });
    const detected = detector.detect(testImageData);
    if (detected.length > 0) {
      console.log('ArUco 자체 검증 성공: ID=' + detected[0].id);
    } else {
      console.warn('ArUco 자체 검증 실패 — 마커가 인식되지 않음');
      // 에러 표시
      canvas.parentElement.querySelector('.card-label').textContent = 'ArUco 생성 실패 — 콘솔 확인';
      canvas.parentElement.querySelector('.card-label').style.color = 'red';
    }

  } catch(e) {
    console.error('ArUco 마커 생성 에러:', e);
    ctx.fillStyle = '#fee';
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#c00';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ArUco 생성 실패', px/2, px/2 - 20);
    ctx.font = '14px sans-serif';
    ctx.fillText(e.message, px/2, px/2 + 20);
  }
}

window.onload = function() {
  drawQR();
  drawArUco();
};
</script>
</body>
</html>
