<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>마커 측정 정밀도 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/dictionaries/aruco_4x4_1000.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  body { font-family:-apple-system,'Pretendard',sans-serif; background:#111; color:#fff; min-height:100vh; overflow-x:hidden; }

  .steps { display:flex; padding:12px 16px; background:#1a1a1a; border-bottom:1px solid #333; gap:4px; }
  .step { flex:1; text-align:center; font-size:11px; padding:6px 0; border-radius:6px; color:#666; font-weight:600; }
  .step.active { background:#3B5998; color:#fff; }
  .step.done { background:#1e3a1e; color:#4ade80; }

  .camera-wrap { position:relative; width:100%; max-width:600px; margin:0 auto; background:#000; }
  .camera-wrap video { width:100%; display:block; }
  #capture-canvas { display:none; }

  .shutter-wrap { display:flex; justify-content:center; padding:20px; background:#111; }
  .shutter { width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .shutter-inner { width:58px; height:58px; border-radius:50%; background:#fff; transition:transform 0.1s; }
  .shutter:active .shutter-inner { transform:scale(0.9); }

  .photo-wrap { position:relative; width:100%; max-width:600px; margin:0 auto; display:none; touch-action:none; }
  .photo-wrap img { width:100%; display:block; }
  .photo-wrap .overlay-canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }

  .tap-guide { text-align:center; padding:16px; font-size:15px; font-weight:600; }
  .tap-guide .sub { font-size:12px; color:#888; margin-top:4px; font-weight:400; }

  .magnifier {
    position:absolute; width:120px; height:120px; border-radius:50%;
    border:3px solid #fff; box-shadow:0 4px 20px rgba(0,0,0,0.5);
    overflow:hidden; display:none; pointer-events:none; z-index:50;
  }
  .magnifier canvas { width:100%; height:100%; display:block; }
  .magnifier-crosshair {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:20px; height:20px; pointer-events:none;
  }
  .magnifier-crosshair::before, .magnifier-crosshair::after {
    content:''; position:absolute; background:rgba(255,0,0,0.7);
  }
  .magnifier-crosshair::before { width:1px; height:100%; left:50%; top:0; }
  .magnifier-crosshair::after { height:1px; width:100%; top:50%; left:0; }
  .magnifier-dot {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:6px; height:6px; border-radius:50%; background:#ef4444; pointer-events:none;
  }

  .result-section { padding:16px; max-width:600px; margin:0 auto; }
  .result-card { background:#1a1a1a; border-radius:12px; padding:16px; margin-bottom:12px; }
  .result-card h3 { font-size:14px; color:#3B5998; margin-bottom:8px; }
  .big-result { font-size:48px; font-weight:800; color:#4ade80; text-align:center; padding:24px 0; }
  .big-result .unit { font-size:24px; font-weight:600; }
  .detail-row { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid #222; }
  .detail-row .label { color:#888; }
  .detail-row .value { color:#fff; font-family:'SF Mono',monospace; }
  .error { color:#ef4444; }
  .success { color:#4ade80; }
  .warning { color:#fbbf24; }

  .btn-row { display:flex; gap:12px; padding:16px; justify-content:center; max-width:600px; margin:0 auto; }
  .btn { padding:12px 24px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary { background:#3B5998; color:#fff; }
  .btn-danger { background:#ef4444; color:#fff; }
  .btn-ghost { background:#333; color:#fff; }
  .btn:active { opacity:0.8; }

  .info-box { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:12px; margin:12px 16px; font-size:12px; color:#94a3b8; line-height:1.6; max-width:600px; }

  .size-input-row { display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 16px; flex-wrap:wrap; }
  .size-input-row label { font-size:13px; color:#888; }
  .size-input-row input { background:#333; border:1px solid #555; border-radius:6px; padding:6px 10px; color:#fff; font-size:14px; width:70px; text-align:center; font-family:inherit; }
  .size-input-row span { font-size:12px; color:#666; }

  /* 토글 */
  .toggle-row { display:flex; justify-content:center; padding:12px 16px; gap:0; }
  .toggle-btn { padding:10px 24px; font-size:14px; font-weight:600; border:2px solid #3B5998; background:transparent; color:#3B5998; cursor:pointer; font-family:inherit; }
  .toggle-btn:first-child { border-radius:8px 0 0 8px; }
  .toggle-btn:last-child { border-radius:0 8px 8px 0; }
  .toggle-btn.active { background:#3B5998; color:#fff; }
  .toggle-btn:active { opacity:0.8; }

  .history-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #222; }
  .history-item .num { font-size:28px; font-weight:800; color:#4ade80; }
  .history-item .meta { font-size:12px; color:#888; text-align:right; }
  .history-item .type-badge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; }
  .type-qr { background:#1e3a5e; color:#60a5fa; }
  .type-aruco { background:#3a2e1e; color:#f59e0b; }
</style>
</head>
<body>

<div class="steps">
  <div class="step active" id="step1">1. 촬영</div>
  <div class="step" id="step2">2. 인식</div>
  <div class="step" id="step3">3. 측정</div>
  <div class="step" id="step4">4. 결과</div>
</div>

<!-- Phase 1: 카메라 -->
<div id="phase-camera">
  <div class="toggle-row">
    <button class="toggle-btn active" id="toggle-qr" onclick="setMode('qr')">QR Code</button>
    <button class="toggle-btn" id="toggle-aruco" onclick="setMode('aruco')">ArUco</button>
  </div>
  <div class="info-box" id="mode-info">
    QR코드 카드와 측정할 물건을 함께 놓고 촬영하세요.
  </div>
  <div class="size-input-row">
    <label>마커 실제 크기:</label>
    <input type="number" id="marker-real-size" value="44" step="0.1">
    <span>mm</span>
  </div>
  <div class="camera-wrap">
    <video id="video" autoplay playsinline></video>
    <canvas id="capture-canvas"></canvas>
  </div>
  <div class="shutter-wrap">
    <div class="shutter" onclick="capture()"><div class="shutter-inner"></div></div>
  </div>
</div>

<!-- Phase 2: 인식 -->
<div id="phase-detect" style="display:none">
  <div class="photo-wrap" id="detect-photo">
    <img id="detect-img">
    <canvas class="overlay-canvas" id="detect-overlay"></canvas>
  </div>
  <div class="tap-guide" id="detect-status">인식 중...</div>
</div>

<!-- Phase 3: 탭 측정 -->
<div id="phase-measure" style="display:none">
  <div class="tap-guide" id="tap-guide">
    <span id="tap-text">측정할 물건의 <strong>시작점</strong>을 탭하세요</span>
    <div class="sub">길게 누르면 돋보기로 정밀 조준할 수 있습니다</div>
  </div>
  <div class="photo-wrap" id="measure-photo">
    <img id="measure-img">
    <canvas class="overlay-canvas" id="measure-overlay"></canvas>
    <div class="magnifier" id="magnifier">
      <canvas id="mag-canvas" width="240" height="240"></canvas>
      <div class="magnifier-crosshair"></div>
      <div class="magnifier-dot"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="undoTap()">탭 취소</button>
    <button class="btn btn-danger" onclick="resetAll()">다시 촬영</button>
  </div>
</div>

<!-- Phase 4: 결과 -->
<div id="phase-result" style="display:none">
  <div class="result-section">
    <div class="big-result" id="big-result">--</div>
    <div class="result-card">
      <h3>측정 상세</h3>
      <div id="measure-details"></div>
    </div>
    <div class="result-card">
      <h3>마커 인식 정보</h3>
      <div id="marker-details"></div>
    </div>
    <div class="result-card">
      <h3>측정 이력</h3>
      <div id="history-list"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="resetAll()">다시 측정</button>
  </div>
</div>

<script>
const STATE = {
  phase: 'camera',
  mode: 'qr', // 'qr' or 'aruco'
  imgW: 0, imgH: 0,
  displayW: 0, displayH: 0,
  corners: null, // 4 corners [{x,y}]
  pxPerMm: 0,
  taps: [],
  history: [],
  capturedDataUrl: null,
  capturedImageData: null,
  measureListenersAttached: false,
  markerInfo: {}, // extra info (id, etc)
};

const MAGNIFIER_ZOOM = 5;
let arucoDetector = null;

// ===== 모드 토글 =====
function setMode(mode) {
  STATE.mode = mode;
  document.getElementById('toggle-qr').className = 'toggle-btn' + (mode==='qr' ? ' active' : '');
  document.getElementById('toggle-aruco').className = 'toggle-btn' + (mode==='aruco' ? ' active' : '');
  document.getElementById('mode-info').innerHTML = mode === 'qr'
    ? 'QR코드 카드와 측정할 물건을 함께 놓고 촬영하세요.'
    : 'ArUco 마커 카드와 측정할 물건을 함께 놓고 촬영하세요.<br><span style="color:#f59e0b">DICT_4X4 (ID:0) 마커를 사용합니다.</span>';
}

// ===== 초기화 =====
async function init() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:4032}, height:{ideal:3024} }
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    document.getElementById('phase-camera').innerHTML =
      `<div class="info-box" style="color:#ef4444">카메라 접근 실패: ${e.message}<br><br>HTTPS 환경에서만 카메라가 작동합니다.</div>`;
  }

  // ArUco 디텍터 초기화
  try {
    arucoDetector = new AR.Detector({ dictionaryName: 'ARUCO_4X4_1000' });
  } catch(e) {
    console.warn('ArUco detector init failed:', e);
  }
}

// ===== Phase 1: 촬영 =====
function capture() {
  const video = document.getElementById('video');
  if (!video.srcObject) return;
  const canvas = document.getElementById('capture-canvas');
  STATE.imgW = video.videoWidth;
  STATE.imgH = video.videoHeight;
  canvas.width = STATE.imgW;
  canvas.height = STATE.imgH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  STATE.capturedDataUrl = canvas.toDataURL('image/jpeg', 0.95);
  STATE.capturedImageData = ctx.getImageData(0, 0, STATE.imgW, STATE.imgH);

  goPhase('detect');
  detectMarker();
}

// ===== Phase 2: 마커 인식 =====
function detectMarker() {
  if (STATE.mode === 'qr') detectQR();
  else detectArUco();
}

function detectQR() {
  const status = document.getElementById('detect-status');
  status.textContent = 'QR코드 인식 중...';
  setupDetectImage();

  const qr = jsQR(STATE.capturedImageData.data, STATE.imgW, STATE.imgH, { inversionAttempts:'dontInvert' });

  if (!qr) {
    status.innerHTML = '<span class="error">QR코드를 찾지 못했습니다</span><br><button class="btn btn-ghost" style="margin-top:12px" onclick="resetAll()">다시 촬영</button>';
    return;
  }

  STATE.corners = [
    { x: qr.location.topLeftCorner.x, y: qr.location.topLeftCorner.y },
    { x: qr.location.topRightCorner.x, y: qr.location.topRightCorner.y },
    { x: qr.location.bottomRightCorner.x, y: qr.location.bottomRightCorner.y },
    { x: qr.location.bottomLeftCorner.x, y: qr.location.bottomLeftCorner.y },
  ];
  STATE.markerInfo = { type:'QR', content: qr.data || '(없음)' };

  onMarkerDetected();
}

function detectArUco() {
  const status = document.getElementById('detect-status');
  status.textContent = 'ArUco 마커 인식 중...';
  setupDetectImage();

  if (!arucoDetector) {
    status.innerHTML = '<span class="error">ArUco 디텍터 초기화 실패</span><br><button class="btn btn-ghost" style="margin-top:12px" onclick="resetAll()">다시 촬영</button>';
    return;
  }

  const markers = arucoDetector.detect(STATE.capturedImageData);

  if (!markers || markers.length === 0) {
    status.innerHTML = '<span class="error">ArUco 마커를 찾지 못했습니다</span><br><button class="btn btn-ghost" style="margin-top:12px" onclick="resetAll()">다시 촬영</button>';
    return;
  }

  const marker = markers[0];
  STATE.corners = marker.corners.map(c => ({ x: c.x, y: c.y }));
  STATE.markerInfo = { type:'ArUco', id: marker.id, hamming: marker.hammingDistance };

  onMarkerDetected();
}

function setupDetectImage() {
  const img = document.getElementById('detect-img');
  img.src = STATE.capturedDataUrl;
  document.getElementById('detect-photo').style.display = 'block';
}

function onMarkerDetected() {
  const markerRealMm = parseFloat(document.getElementById('marker-real-size').value) || 44;
  const sides = calcSides(STATE.corners);
  const avgSide = sides.reduce((a,b)=>a+b,0) / 4;
  STATE.pxPerMm = avgSide / markerRealMm;

  const img = document.getElementById('detect-img');
  const overlay = document.getElementById('detect-overlay');
  const status = document.getElementById('detect-status');

  const color = STATE.mode === 'qr' ? '#4ade80' : '#f59e0b';
  const label = STATE.mode === 'qr' ? 'QR' : `ArUco ID:${STATE.markerInfo.id}`;

  img.onload = function() {
    STATE.displayW = img.clientWidth;
    STATE.displayH = img.clientHeight;
    setupOverlay(overlay, STATE.displayW, STATE.displayH);

    const ctx = overlay.getContext('2d');
    const sx = STATE.displayW / STATE.imgW;
    const sy = STATE.displayH / STATE.imgH;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    STATE.corners.forEach((c,i) => {
      const x=c.x*sx, y=c.y*sy;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.stroke();

    STATE.corners.forEach((c,i) => {
      const x=c.x*sx, y=c.y*sy;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(i+1, x, y);
    });

    status.innerHTML = `<span class="success">${label} 인식 완료</span><br><span style="font-size:12px;color:#888">${avgSide.toFixed(0)}px | ${STATE.pxPerMm.toFixed(2)} px/mm | 기준 ${markerRealMm}mm</span>`;
    setTimeout(() => goPhase('measure'), 1000);
  };
}

// ===== Phase 3: 탭 측정 =====
function initMeasurePhase() {
  const img = document.getElementById('measure-img');
  const overlay = document.getElementById('measure-overlay');

  img.src = STATE.capturedDataUrl;
  document.getElementById('measure-photo').style.display = 'block';
  STATE.taps = [];
  updateTapGuide();

  img.onload = function() {
    STATE.displayW = img.clientWidth;
    STATE.displayH = img.clientHeight;
    setupOverlay(overlay, STATE.displayW, STATE.displayH);
    drawMeasureOverlay();

    if (!STATE.measureListenersAttached) {
      const wrap = document.getElementById('measure-photo');
      wrap.addEventListener('touchstart', onTouchStart, {passive:false});
      wrap.addEventListener('touchmove', onTouchMove, {passive:false});
      wrap.addEventListener('touchend', onTouchEnd, {passive:false});
      wrap.addEventListener('mousedown', onMouseDown);
      STATE.measureListenersAttached = true;
    }
  };
}

let touchTimer = null;
let isMagnifying = false;
let currentTouch = {x:0, y:0};

function onTouchStart(e) {
  e.preventDefault();
  if (STATE.phase !== 'measure' || STATE.taps.length >= 2) return;
  const t = e.touches[0];
  const rect = e.currentTarget.getBoundingClientRect();
  currentTouch.x = t.clientX - rect.left;
  currentTouch.y = t.clientY - rect.top;
  touchTimer = setTimeout(() => {
    isMagnifying = true;
    showMagnifier(currentTouch.x, currentTouch.y);
  }, 200);
}

function onTouchMove(e) {
  e.preventDefault();
  if (STATE.phase !== 'measure') return;
  const t = e.touches[0];
  const rect = e.currentTarget.getBoundingClientRect();
  currentTouch.x = t.clientX - rect.left;
  currentTouch.y = t.clientY - rect.top;
  if (isMagnifying) showMagnifier(currentTouch.x, currentTouch.y);
}

function onTouchEnd(e) {
  e.preventDefault();
  clearTimeout(touchTimer);
  if (STATE.phase !== 'measure' || STATE.taps.length >= 2) { hideMagnifier(); isMagnifying=false; return; }

  const imgX = (currentTouch.x / STATE.displayW) * STATE.imgW;
  const imgY = (currentTouch.y / STATE.displayH) * STATE.imgH;
  STATE.taps.push({imgX, imgY});

  hideMagnifier();
  isMagnifying = false;
  drawMeasureOverlay();
  updateTapGuide();

  if (STATE.taps.length === 2) {
    if (navigator.vibrate) navigator.vibrate(50);
    setTimeout(() => showResult(), 500);
  }
}

function onMouseDown(e) {
  if (STATE.phase !== 'measure' || STATE.taps.length >= 2) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const dx = e.clientX - rect.left;
  const dy = e.clientY - rect.top;
  const imgX = (dx / STATE.displayW) * STATE.imgW;
  const imgY = (dy / STATE.displayH) * STATE.imgH;
  STATE.taps.push({imgX, imgY});
  drawMeasureOverlay();
  updateTapGuide();
  if (STATE.taps.length === 2) setTimeout(() => showResult(), 500);
}

function showMagnifier(dx, dy) {
  const mag = document.getElementById('magnifier');
  const magCanvas = document.getElementById('mag-canvas');
  const ctx = magCanvas.getContext('2d');

  mag.style.display = 'block';
  mag.style.left = Math.max(0, Math.min(dx - 60, STATE.displayW - 120)) + 'px';
  mag.style.top = Math.max(0, dy - 140) + 'px';

  const imgX = (dx / STATE.displayW) * STATE.imgW;
  const imgY = (dy / STATE.displayH) * STATE.imgH;
  const srcSize = 240 / MAGNIFIER_ZOOM * (STATE.imgW / STATE.displayW);

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = STATE.imgW;
  tempCanvas.height = STATE.imgH;
  tempCanvas.getContext('2d').putImageData(STATE.capturedImageData, 0, 0);

  ctx.clearRect(0, 0, 240, 240);
  ctx.drawImage(tempCanvas, imgX - srcSize/2, imgY - srcSize/2, srcSize, srcSize, 0, 0, 240, 240);
}

function hideMagnifier() { document.getElementById('magnifier').style.display = 'none'; }

function drawMeasureOverlay() {
  const overlay = document.getElementById('measure-overlay');
  const ctx = overlay.getContext('2d');
  const sx = STATE.displayW / STATE.imgW;
  const sy = STATE.displayH / STATE.imgH;
  const color = STATE.mode === 'qr' ? 'rgba(74,222,128,0.4)' : 'rgba(245,158,11,0.4)';
  ctx.clearRect(0, 0, STATE.displayW, STATE.displayH);

  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath();
  STATE.corners.forEach((c,i) => { i===0 ? ctx.moveTo(c.x*sx,c.y*sy) : ctx.lineTo(c.x*sx,c.y*sy); });
  ctx.closePath(); ctx.stroke();

  STATE.taps.forEach((t, i) => {
    const x=t.imgX*sx, y=t.imgY*sy;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(i+1, x, y);
  });

  if (STATE.taps.length === 2) {
    const t1=STATE.taps[0], t2=STATE.taps[1];
    const x1=t1.imgX*sx, y1=t1.imgY*sy, x2=t2.imgX*sx, y2=t2.imgY*sy;

    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);

    const pxDist = Math.sqrt((t2.imgX-t1.imgX)**2 + (t2.imgY-t1.imgY)**2);
    const mmDist = pxDist / STATE.pxPerMm;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const text = `${(mmDist/10).toFixed(1)}cm`;
    ctx.font = 'bold 16px sans-serif';
    const tw = ctx.measureText(text).width + 16;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(mx-tw/2, my-14, tw, 28);
    ctx.fillStyle = '#4ade80';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, mx, my);
  }
}

function updateTapGuide() {
  const el = document.getElementById('tap-text');
  if (STATE.taps.length === 0) el.innerHTML = '측정할 물건의 <strong>시작점</strong>을 탭하세요';
  else if (STATE.taps.length === 1) el.innerHTML = '측정할 물건의 <strong>끝점</strong>을 탭하세요';
  else el.innerHTML = '<span class="success">측정 완료</span>';
}

function undoTap() {
  if (STATE.taps.length > 0) { STATE.taps.pop(); drawMeasureOverlay(); updateTapGuide(); }
}

// ===== Phase 4: 결과 =====
function showResult() {
  const t1=STATE.taps[0], t2=STATE.taps[1];
  const pxDist = Math.sqrt((t2.imgX-t1.imgX)**2 + (t2.imgY-t1.imgY)**2);
  const mmDist = pxDist / STATE.pxPerMm;
  const cmDist = mmDist / 10;

  const sides = calcSides(STATE.corners);
  const avgSide = sides.reduce((a,b)=>a+b,0)/4;
  const sideDeviation = Math.max(...sides)-Math.min(...sides);
  const skewRatio = Math.max(...sides)/Math.min(...sides);
  const markerRealMm = parseFloat(document.getElementById('marker-real-size').value) || 44;

  STATE.history.push({
    mode: STATE.mode,
    mm: mmDist, cm: cmDist,
    pxPerMm: STATE.pxPerMm, pxDist,
    markerPixelSize: avgSide,
    imgSize: `${STATE.imgW}x${STATE.imgH}`,
    sideDeviation, skewRatio,
    markerRealMm,
    markerInfo: {...STATE.markerInfo},
    corners: STATE.corners.map(c => ({x:c.x, y:c.y})),
  });

  goPhase('result');

  document.getElementById('big-result').innerHTML = `${cmDist.toFixed(1)}<span class="unit">cm</span>`;

  document.getElementById('measure-details').innerHTML = `
    <div class="detail-row"><span class="label">측정 결과</span><span class="value">${mmDist.toFixed(1)}mm (${cmDist.toFixed(2)}cm)</span></div>
    <div class="detail-row"><span class="label">픽셀 거리</span><span class="value">${pxDist.toFixed(1)}px</span></div>
    <div class="detail-row"><span class="label">px/mm 비율</span><span class="value">${STATE.pxPerMm.toFixed(4)}</span></div>
    <div class="detail-row"><span class="label">1px 당</span><span class="value">${(1/STATE.pxPerMm).toFixed(4)}mm</span></div>
  `;

  const hasFloat = STATE.corners.some(c => c.x % 1 !== 0 || c.y % 1 !== 0);
  const typeLabel = STATE.mode === 'qr' ? 'QR Code' : `ArUco ID:${STATE.markerInfo.id}`;
  document.getElementById('marker-details').innerHTML = `
    <div class="detail-row"><span class="label">마커 종류</span><span class="value">${typeLabel}</span></div>
    <div class="detail-row"><span class="label">이미지 크기</span><span class="value">${STATE.imgW}x${STATE.imgH}</span></div>
    <div class="detail-row"><span class="label">기준 크기</span><span class="value">${markerRealMm}mm</span></div>
    <div class="detail-row"><span class="label">마커 픽셀 크기</span><span class="value">${avgSide.toFixed(2)}px</span></div>
    <div class="detail-row"><span class="label">변 길이 편차</span><span class="value ${sideDeviation > avgSide*0.15 ? 'warning' : 'success'}">${sideDeviation.toFixed(2)}px</span></div>
    <div class="detail-row"><span class="label">비스듬함</span><span class="value ${skewRatio > 1.15 ? 'warning' : 'success'}">${skewRatio.toFixed(3)} ${skewRatio > 1.15 ? '(보정 필요)' : '(양호)'}</span></div>
    <div class="detail-row"><span class="label">좌표 정밀도</span><span class="value ${hasFloat ? 'success' : 'warning'}">${hasFloat ? '소수점 (정밀)' : '정수 (제한적)'}</span></div>
    ${STATE.mode === 'aruco' ? `<div class="detail-row"><span class="label">해밍 거리</span><span class="value">${STATE.markerInfo.hamming}</span></div>` : ''}
    <div style="margin-top:8px;font-size:11px;color:#666;font-family:monospace;">
      ${STATE.corners.map((c,i) => `P${i+1}: (${c.x.toFixed(4)}, ${c.y.toFixed(4)})`).join('<br>')}
    </div>
  `;

  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!STATE.history.length) { el.innerHTML = '<div style="color:#666;font-size:13px">아직 없음</div>'; return; }
  el.innerHTML = STATE.history.map((h,i) => `
    <div class="history-item">
      <div>
        <div class="num">${h.cm.toFixed(1)}cm</div>
        <div style="font-size:11px;color:#666">${h.mm.toFixed(1)}mm</div>
      </div>
      <div class="meta">
        #${i+1} <span class="type-badge ${h.mode==='qr'?'type-qr':'type-aruco'}">${h.mode==='qr'?'QR':'ArUco'}</span><br>
        ${h.markerPixelSize.toFixed(0)}px | ${h.pxPerMm.toFixed(2)}px/mm<br>
        ${h.imgSize}
      </div>
    </div>
  `).reverse().join('');
}

// ===== 유틸 =====
function calcSides(corners) {
  const sides = [];
  for (let i=0;i<4;i++) {
    const n=(i+1)%4;
    const dx=corners[n].x-corners[i].x, dy=corners[n].y-corners[i].y;
    sides.push(Math.sqrt(dx*dx+dy*dy));
  }
  return sides;
}

function setupOverlay(canvas, w, h) {
  canvas.width = w; canvas.height = h;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

function goPhase(phase) {
  STATE.phase = phase;
  ['camera','detect','measure','result'].forEach(p => {
    document.getElementById('phase-'+p).style.display = p===phase ? '' : 'none';
  });
  const steps = ['camera','detect','measure','result'];
  const idx = steps.indexOf(phase);
  steps.forEach((s,i) => {
    document.getElementById('step'+(i+1)).className = 'step' + (i<idx?' done':i===idx?' active':'');
  });
  if (phase === 'measure') initMeasurePhase();
}

function resetAll() {
  STATE.corners = null; STATE.pxPerMm = 0; STATE.taps = [];
  STATE.capturedDataUrl = null; STATE.capturedImageData = null;
  STATE.markerInfo = {};
  document.getElementById('detect-photo').style.display = 'none';
  document.getElementById('measure-photo').style.display = 'none';
  goPhase('camera');
}

window.onload = init;
</script>
</body>
</html>
